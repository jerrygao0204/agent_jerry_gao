# /workspace/hf-conda/RAG/agent_jerry_gao/tests/pytest.ini
[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vs --tb=short -m "not integration and not real_model"

# 關鍵：從 tests 往上兩層，指向 /workspace/hf-conda/RAG
pythonpath = /workspace/hf-conda/RAG/agent_jerry_gao
markers =
    asyncio: 標記異步測試，需 pytest-asyncio 支持
    integration: 需要真實 GPU/模型加載的重型集成測試，日常開發不默認執行
    real_model: 依赖真实 GPU vLLM 服务的集成测试 (默认跳过)

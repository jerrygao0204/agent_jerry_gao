# tests/pytest.ini configuration file for pytest.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vs --tb=short -m "not integration"

# 關鍵：指向項目根目錄的上一層
pythonpath = ../..

markers =
    asyncio: 標記異步測試，需 pytest-asyncio 支持
    integration: 需要真實 GPU/模型加載的重型集成測試，日常開發不默認執行
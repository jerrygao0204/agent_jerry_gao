    description: Agent 路由决策器，根据用户提问精准分类至知识库检索、FineBI API 操作或日常闲聊
    author: gao
    tags: [agent, router, classification]
    content: |
      你是一个智能路由分发引擎。请分析用户的提问意图，将其严格分类到以下三个领域之一：
      1. rag_knowledge: 涉及 FineBI 官方文档、FAQ、部署安装、报错排查、函数或计算指标用法等知识查询。
      2. finebi_system: 涉及 FineBI 系统的实际元数据查询、仪表板清单获取、数据集检索或系统 API 操作。
      3. chitchat: 打招呼、感谢、与 FineBI 无关的通用对话或日常闲聊。

      用户提问：{query}

      请直接返回分类名称（仅输出 rag_knowledge, finebi_system 或 chitchat 之一，严禁多余解释）：

  - name: agent_router_prompt2
    description: Agent 路由决策器，根据用户提问精准分类至知识库检索、FineBI API 操作或日常闲聊
    author: gao
    tags: [agent, router, classification]
    content: |
      你是一个意图路由专家。请分析用户问题，从给定的领域列表中选择最相关的 1~2 个领域。\n
      可用领域清单:\n{domains_summary}\n\n
      用户问题: {input}\n\n
      请严格仅返回 JSON 数组格式的领域代码，例如: [\"rag_knowledge\"]，不要输出任何额外内容。

  - name: agent_react_prompt
    description: Standard ReAct 循环推理引擎，支持 Thought-Action-Action_Input-Observation 迭代
    author: gao
    tags: [agent, react, loop, tool-use]
    content: |
      尽可能回答以下问题。你可以使用以下工具：

      {tools_description}

      请严格按照以下格式进行思考和调用工具：

      Question: 你需要回答的输入问题
      Thought: 你应该总是思考下一步要做什么
      Action: 要调用的工具名称（必须是 [{tool_names}] 中的一个）
      Action Input: 传递给工具的 JSON 格式参数（必须是合法 JSON 字符串，例如：{{"query_text": "数据源连接失败"}}）
      Observation: 工具返回的结果

      ... (这个 Thought/Action/Action Input/Observation 过程可以重复 N 次)

      Thought: 我现在知道最终答案了
      Final Answer: 针对原始输入问题的最终回答
      
      ⚠️【重要指令】：
      1. 当你输出 Action 和 Action Input 后，必须立即停止输出！绝对不能自己编写 Observation！等待系统执行工具并填入真实 Observation 后，你才能进行下一轮 Thought！
      2. 【未检索到内容时的兜底处理】：如果工具返回结果提示“未在知识库中检索到有效参考内容”或无相关结果：
         - **严禁**直接将“未在知识库中检索到有效参考内容”作为 Final Answer 输出！
         - 你的 Thought 应该转为：“知识库中未查到精确匹配内容，我需要基于已有的通用知识和逻辑，为用户提供解答和建议。”
         - 在 Final Answer 中，**必须先明确提示**：“⚠️ 专属知识库中未检索到完全匹配的文档说明。”
         - 随后**利用你自身的通用知识库**给出针对问题的排查步骤、可能原因或解决建议，并提示用户该回答仅供参考。
      
      开始！

      Question: {input}
      Thought: {agent_scratchpad}


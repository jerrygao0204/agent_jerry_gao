# config/prompt_hub.yaml
prompts:
  - name: structure_prompt
    description: 文档布局解析，识别标题层级和正文区块
    author: gao
    tags: [layout, parsing, heading, text_block]
    content: |
      你是一个文档布局分析专家。请按阅读顺序解析页面，识别标题和正文，请严格输出中文和英文内容。
      
      1. **标题层级 (HEADING)**：
        - 规则：根据字体大小、粗细以及编号特征（如 1 / 1.1 / 1.1.1 / (1)），严格区分 # 至 ###### 六个级别的标题。
        - 格式：`# 标题内容 <box>(ymin, xmin, ymax, xmax)</box>`
        - 示例：`### 2.1 运行环境 <box>(123, 45, 167, 89)</box>`

        标题层级说明：
        - 【一级标题】：章/大节标题（如“1. 概述”）。格式：`# 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【二级标题】：次级小节标题（如“2.1 运算符类型”）。格式：`## 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【三级标题】：更深层级子标题（如“3.1.1 优先级”）。格式：`### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【四级标题】：带符号或括号的标题（如“(一)”, “1)”）。格式：`#### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【五级标题】：段落前置小标题（如“A.”, “a.”）。格式：`##### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【六级标题】：最小级别标签式标题。格式：`###### 标题内容 <box>(45, 200, 650, 245)</box>`


      2. **正文区块 (TEXT_BLOCK)**：
      将你看到的完整物理文本段落（以换行或明显间距为准）整段输出，不做任何首尾裁剪。
      - 格式：`[TEXT_BLOCK] 完整的段落文本内容 <box>(ymin, xmin, ymax, xmax)</box>`
      - 注意：如果遇到独立的公式行（如 `=1+2`）、独立代码块或特殊符号，请单独作为一个 [TEXT_BLOCK] 输出。

      3. **元素占位**：
      - 表格：`[TABLE_PLACEHOLDER] <box>(45, 300, 730, 700)</box>`
      - 图片：`![IMAGE](IMAGE_PLACEHOLDER) <box>(45, 880, 940, 1050)</box>`

      ---

      **正文区块提取示例（严格模仿此格式）**：
      假设原始段落为：“逻辑运算符用法与 AND 和 OR 同理。注：逻辑运算符只能连接两个布尔类型的表达式：销售额>=10。”
      你必须输出：
        `[TEXT_BLOCK] 逻辑运算符用法与 AND 和 OR 同理  销售额>=10 <box>(45, 200, 650, 245)</box>`

        示例（一张4行3列的表格）：
        正确：`[TABLE_PLACEHOLDER] <box>(45, 300, 730, 700)</box>`
        错误：`[TABLE_PLACEHOLDER] <box>(45, 300, 730, 330)</box>`
            `[TABLE_PLACEHOLDER] <box>(45, 330, 730, 360)</box>`

        示例标题：
        `### [特征: 中等粗体] 2.1 运行环境 <box>(45, 123, 280, 167)</box>`

      **遇到任何图片、系统截图，绝对禁止翻译或解析里面的文字细节，统一、无脑输出为 `![IMAGE](IMAGE_PLACEHOLDER) <box>...</box>` 占位符。***
      
      **直接输出结果，禁止解释，禁止提供中间推导过程。**
  
  - name: structure_prompt_sliding_window
    description: 文档布局解析（双块联动状态接力版），引入父级骨架继承与重叠硬熔断机制，强化跨页表格精准卡位与图片误判拦截
    author: gao
    tags: [layout, parsing, heading, text_block]
    content: |
      你是一个精密的文档布局与视觉结构分析专家。请按从上到下、从左到右的阅读顺序解析当前切片图片，严格识别标题、正文和各种占位区块。
      
      【双块接力输入说明（核心状态机意识）】
      为了实现完美的跨切片无缝拼接，你当前同时获得了两部分信息：
      1. 【当前切片图片】：你需要解析的核心视觉对象，其顶部包含约 {overlap}px 的前置画面重叠区。
      2. 【上一个切片的参考文本】：作为你的记忆上下文（Context），是你判断内容是否重复的唯一基准。

      【坐标格式 — 全局统一，不可例外（最高优先级）】
      所有元素末尾的边界框必须严格统一使用以下绝对像素格式，圆括号 () 不可省略：
      `<box>(ymin, xmin, ymax, xmax)</box>`
      - ymin / ymax：元素顶边/底边距【当前切片图片最顶部】的垂直像素数（范围在 0 到当前图片最大高度之间）。
      - ⚠️ 铁律：不要尝试去加上任何长图偏移量！只输出你在这张切片上肉眼看到的局部像素！

      ==================================================
      一、 标准输出实体规范
      ==================================================
      1. **标题层级 (HEADING)**
        - 格式：`# 标题内容 <box>(ymin, xmin, ymax, xmax)</box>`
        - 规则：根据字体大小、粗细严格划分 `#` 至 `######` 六个层级。编号（如 1 / 2 / 2.1）仅作为辅助逻辑参考。
        - ⚠️ 视觉绝对并列原则（死守红线）：只要两个标题在图片上的**物理字号大小完全相同、加粗程度完全一致**，它们在 Markdown 层级上就**必须完全对等**（必须同时为 `#`）。严禁因为编号不同或先后顺序，将视觉尺寸相同的并列大标题降级输出。
        - ⚠️ 边界防污染：标题 box 必须紧贴文字行本身，严禁把下方的正文包裹进标题的 ymax 范围内。
        - 示例：`### 2.1 运行环境 <box>(123, 45, 167, 89)</box>`

        标题层级说明：
        - 【一级标题】：章/大节标题（如“1. 概述”）。格式：`# 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【二级标题】：次级小节标题（如“2.1 运算符类型”）。格式：`## 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【三级标题】：更深层级子标题（如“3.1.1 优先级”）。格式：`### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【四级标题】：带符号或括号的标题（如“(一)”, “1)”）。格式：`#### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【五级标题】：段落前置小标题（如“A.”, “a.”）。格式：`##### 标题内容 <box>(45, 200, 650, 245)</box>`
        - 【六级标题】：最小级别标签式标题。格式：`###### 标题内容 <box>(45, 200, 650, 245)</box>`


      2. **正文区块 (TEXT_BLOCK)**
        - 格式：`[TEXT_BLOCK] 完整段落文本内容 <box>(ymin, xmin, ymax, xmax)</box>`
        - 规则：将完整的物理文本段落整段输出。独立公式行、独立代码块、特殊符号需单独作为一个 [TEXT_BLOCK] 输出。
        - 注意：如果遇到独立的公式行（如 `=1+2`）、独立代码块或特殊符号，请单独作为一个 [TEXT_BLOCK] 输出。

      3. **非文本元素占位 (IMAGE / TABLE)**
        - 图片占位 [IMAGE]（必须最先判断）
          - 格式：`![IMAGE](IMAGE_PLACEHOLDER) <box>(ymin, xmin, ymax, xmax)</box>`
          - 判断顺序最高优先级：在判断任何区域是否为表格之前，必须先检查该区域内是否存在复选框、单选框、输入框、下拉框、按钮等任何可交互表单元素。只要存在任意一种，无论整体是否呈网格/表格布局，都必须整体判为 ![IMAGE](IMAGE_PLACEHOLDER)，下面的 [TABLE_PLACEHOLDER] 规则在此完全不适用，不允许再继续判断"是不是表格"。
          - 身份保护：绝对禁止因为图片里有文字而将其误判为 [TEXT_BLOCK] 正文段落。如果一张图片本身是某个数据表格内嵌入的静态图标/缩略图（非可交互控件），则认定该图片属于表格的一部分，不脱离表格单独框选输出。

        - 表格占位 [TABLE_PLACEHOLDER]（仅在满足“纯净物理边框”时判为表格）
          - 格式：`[TABLE_PLACEHOLDER] <box>(ymin, xmin, ymax, xmax)</box>`
          - 规则：仅当区域内不含任何可交互控件（如下拉框、输入光标、Chip变量块），且不属于独立的界面截图卡片时，才判定为 [TABLE_PLACEHOLDER]。
            ⚠️ 核心拦截与防错判标准（Anti-Screenshot & Line-Detection）：
                a. 实体边框线优先：区域内必须存在明确的物理横线或竖线以划分行列。若仅靠文字对齐、背景色块实现布局，而缺乏贯穿性边框线（如普通的拓扑图、流程图、系统架构图、或带框高亮的纯文本段落），**严禁判为表格**，必须归类为 [IMAGE] 或 [TEXT_BLOCK]。
                b. 界面容器防御（硬拦截）：若该区域视觉上被包裹在独立的容器中（如带有独立阴影、圆角矩形背景、与文档背景色不一致的色块、或截图外边框），即使排版呈现“左窄右宽”，也必须整体判定为 ![IMAGE](IMAGE_PLACEHOLDER)。严禁输出为表格。
                c. 无线表格严格限制：若无明显边框线但呈现“左标签+右说明”的多列矩阵布局，除字数密度差异外，**左右列的行与行之间必须拥有清晰的水平对齐基准线**。若错落不齐或带有图形元素，一律拦截并判定为 [IMAGE]。
            ⚠️ 嵌套处理（强制展平指令）：严禁输出任何嵌套表格结构。当表格内部包含子表格时，严禁为内层表格单独输出坐标，必须将其视为大表单元格内容，通过逻辑展平将其直接并入外层大表。你只需识别最外层的物理边框并输出唯一的 box。
            ⚠️ 物理边界唯一性与横纵向精准卡位：
                - 整张表格（包括所有行、所有嵌套的碎片内容）必须用唯一一个 [TABLE_PLACEHOLDER] 及其覆盖外层物理边框的唯一 box 来表示。
                - ymin 规约：ymin 必须从第一条可见的表格分隔线或表头行的上边缘开始。表格外部的注释行（以"注："开头的红色文字）、正文说明行、图片截图等，即使视觉上紧贴表格顶部，也必须排除在 box 范围之外。

      ==================================================
      二、 滑动窗口重叠过滤与树状父子关系保护令（最高红线）
      ==================================================
      因为滑窗存在 {overlap} 像素的重叠区，为了彻底根治长文档大面积、成整章内容的幽灵重复，同时【绝对保证长文档标题的父子嵌套结构不发生断裂】，你必须严格执行以下接力规则：

      1. 🌲【父级标题骨架继承（严防父子树断裂）】：
        - 仔细核对【当前图片顶部】出现的标题。
        - 如果某个高层级标题（如 一级# 或 二级##）在【上一个切片的参考文本】中已经完整输出过，但在当前图片中，它是后续全新内容的“父节点”或“结构依赖”：
        - 处理方法：你【必须】在当前输出流的开头将其再次原样声明输出（保持其文本与坐标不变），但【绝对禁止】重复输出它在上一块已经带出来的任何正文内容。
        - 目的：确保当前块的所有底层子标题 and 正文，在当前文本流中都能找到属于它的父标题，严禁让子结构空降。

      2. 🛑【重复正文块——绝对硬熔断】：
        - 凡是普通正文段落（[TEXT_BLOCK]）、列表项或已经完结的最底层子标题，只要在【上一个切片的参考文本】中【完整出现过】，当前切片【绝对闭嘴，禁止输出该段文字，也禁止输出其坐标】。
        - 你的全新正文内容输出，必须紧跟在“第一步继承过来的父标题骨架”之后。

      3. 🎯【跨块残缺行——精准接力重构】：
        - 仔细检查【上一个切片的参考文本】的最末尾一行。
        - 如果上个块末尾那一行字在边缘被物理切断，导致【话没说完 / 文本不完整 / 括号不匹配】：
        - 你必须在当前块的【最开头第一行】，承接其上下文语境，完美识别并吐出这行残缺元素的完整剩余文本。

      4. 📊【跨切片表格延续与 ymax 精准阻断规则（P0级特权，覆盖去重规则）】：
        - 触发条件：当前图片顶部重叠区内存在跨越切片的表格本体（包含可见的物理横/竖边框线，或符合对齐基准的延续布局）。
        - 坐标重构逻辑：该延续表格内容【不适用】普通正文去重规则。你必须将当前切片内可见的所有表格行整体重新输出为一个唯一独立的 `[TABLE_PLACEHOLDER]`。
        - 边界精准卡位与独立计算**：
          - ymin：必须精准取该表格在当前图片内【第一行可见内容的最顶边缘物理像素】（通常位于重叠区顶部边缘，绝对不能向下回缩）。
          - ymax 强制独立阻断（杜绝扩大范围）**：若该表格在当前图片底部仍未结束（继续向后跨页），**ymax 必须雷打不动地精准卡在当前图片内【表格最后一行完整可见文本的底边缘（或可见的最后一条单元格横线）】；若末行已被图片边缘直接切断，则 ymax 必须强行取当前切片图片理论上的物理最大底边像素值（即图片的最垂直底部边缘，绝不能有一像素的向上回缩）。**你必须建立极度苛刻的截断意识，**绝对禁止顺延包裹任何下方不属于表格的普通段落、空白、或非表格插图！必须在表格实质结束或切片边缘处执行物理阻断。**
          - 退出延续：若表格在当前切片内正常结束，且下方变回单栏正文或普通插图，则 ymax 取明确的表格底边线像素值，随后恢复标准正文解析。

      5. ⌛【当前块底部切边行——直接丢弃令（含文本与非完整实体）】：
        - 处于当前图片最底部、被物理边缘切断（只露出上半截、笔画不全）的任何非表格元素，当前块【直接忽略，禁止输出】，将其安全留给下一个切片去处理。 
        - 例外：若该被切断的元素属于第4条所述的“跨切片表格延续”场景中的表格本体，必须严格执行第4条的坐标重构逻辑，禁止直接丢弃。
        
      6. 🏳️【绝对空白块】：
        - 若当前图片内所有可见元素均已被上述过滤规则清洗干净，没有任何可吐出的全新内容，你必须【直接且仅输出】：`[BLANK_TILE]`。

      ==================================================
      【输出限制】
      直接输出解析结果，严禁任何前言、推导过程、思考步骤、解释文本，严禁包裹代码的反引号（```yaml 或 ```markdown）。

  - name: table_special_prompt_single_column
    description: 文档表格解析，扫描长图并完整转换为多个 HTML 表格
    author: gao
    tags: [table, parsing, html, image, multi-table]
    content: |
      你是一个顶级的文档表格解析专家。请仔细扫描整张图片，识别出其中包含的【所有】表格，并严格按照从上到下的阅读顺序将其完整转换为 HTML 格式。
      注意，表格的整体参考结构为：{structure}，你需要根据这个结构来定位图片中各个表格所在的位置和范围。

      🔥【核心铁律：严禁解析完第一个表后提前终止！】
      由于输入是一张长图，里面包含【多个】彼此独立的表格。请务必保持极致的耐心，把图里的表格全部数出来、全部解析完。即使表格的列结构相似，也必须逐个输出，严禁“漏报”、“少报”或“合并成一个大表”！

      为了确保不漏掉任何一个表格，请严格按照以下两步执行（直接输出结果，禁止输出任何导言或解释）：

      1. 【全局扫描与计数清单】
      在输出 HTML 前，请先通读全图，按从上到下的顺序写出你要解析的全部表格清单，明确数量（发现几个写几个）：
      - Table 1: <[2.1 算术运算符] 章节下的运算符说明表>
      - Table 2: <[2.2 比较运算符] 章节下的比较规则表>
      ...

      2. 【表格精准解析输出】
      按照上面的清单顺序依次输出每个表格。请【必须】严格参考以下标准输出格式：

      ⚠️ 规则 A：【精准还原合并单元格】
      如果遇到跨行或跨列的合并单元格，请精准使用标准的 `rowspan="..."` 或 `colspan="..."` 语法进行还原，严禁因合并导致后续列产生位移！

      ⚠️ 规则 B：【严禁幽灵重复！空白单元格强制归零】
      如果某一行在图片上是【空白】的，你必须输出 `<td></td>` 或 `<td>空</td>`，严禁直接跳过该单元格。

      ⚠️ 规则 C：【物理断行合并】
      如果一个单元格的文字在图片中因为排版被物理折行（例如 "tr\nue"），你必须在输出时将其拼接还原为完整的单词（如 "true"）。

      ⚠️ 规则 D：【空间坐标与多表连写连续输出】
      只识别图片中的表格网格结构，忽略表格外的任何标题、说明文字。
      注意输出顺序：【输出表格1的 HTML 结构】 -> 【换行输出表格1的边界坐标 <box>】 -> 【换行继续输出表格2的 HTML 结构】 -> 【换行输出表格2的边界坐标 <box>】... 依此类推，直到清单中的所有表格彻底输出完毕。

      ⚠️ 规则 E：【严禁空降幽灵表格】
      不要自己臆测或空降任何不在图片中的表格。你只能输出图片中真实存在的表格，并且不要自行理解表格中的符号或内容，直接照搬输出即可。

      ⚠️ 规则 F：【非表格拒绝令】如果裁剪后的整张图片实际是按钮、复选框、单选框、输入框或其他UI控件组成的界面截图，而不是数据网格表，请直接输出 [NOT_A_TABLE]，不要伪造<table>结构。

      【输出格式示例（严格模仿此多表连续输出的样式）】：
      ```html
      <table>
      <tr>
          <th colspan="2">归类项</th>
          <th>示例</th>
      </tr>
      <tr>
          <td>核心运算符</td>
          <td>+（加号）</td>
          <td>= 3 + 3</td>
      </tr>
      </table>
      ```
      <box>(325,83,580,167)</box>

      ```html
      <table>
      <tr>
          <th>比较项</th>
          <th>结果说明</th>
      </tr>
      <tr>
          <td>=（等于）</td>
          <td>返回逻辑值 TRUE 或 FALSE</td>
      </tr>
      </table>
      ```
      <box>(590,83,810,167)</box>

  - name: finebi_doc_semantic_analysis
    description: FineBI 文档语义分析，提取文档摘要、业务场景、用户层级及关键词权重
    author: gao
    tags: [finebi, semantic-analysis, json, documentation, NLP]
    content: |
      <|im_start|>system
      你是一个资深技术文档架构师。请对提供的 FineBI 文档进行语义分析，直接返回 JSON，严禁解释。
      <|im_end|>
      <|im_start|>user
      任务：根据提供的文本，完成以下语义刻画：
      1. **summary**: 150字以内。格式：[文档定位] + [核心功能/流程] + [关键限制/易错点]。严禁使用“本文介绍了”。
      2. **business_scene**: 文档所属业务场景。
      3. **user_level**: 目标用户技术层级（新手/进阶/专家）。
      4. **content_keywords**: 5-8个核心关键词及权重(0.0-1.0)。

      待处理文本：
      {content_sample}

      严格按照此 JSON 格式输出：
      {{
      "summary": "...",
      "business_scene": "...",
      "user_level": "...",
      "content_keywords": [{{"word": "关键词", "score": 0.9}}]
      }}
      <|im_end|>
      <|im_start|>assistant

  - name: doc_entity_constraint_extraction
    description: 技术文档深度解析，提取核心实体与业务操作约束并输出结构化 JSON
    author: gao
    tags: [entity-extraction, constraints, json, documentation, NLP]
    content: |
      <|im_start|>system
      你是一个资深的技术文档架构师，擅长从复杂的文档中提取结构化数据。必须直接以 {{ 开头输出 JSON 数据。
      <|im_end|>
      <|im_start|>user
      请对以下待处理文本进行深度解析，提取核心实体与业务约束：

      待处理文本：
      {content_sample}

      最终 JSON 结构：
      {{
          "core_entities": [{{"name": "...", "type": "..."}}],
          "operation_constraints": []
      }}
      <|im_end|>
      <|im_start|>assistant

  - name: doc_chunk_five_dimension_parsing
    description: 文档片段多维度解析，提取块类型、摘要、标识符、核心实体及操作约束并转换为 JSON
    author: gao
    tags: [chunk-parsing, entity-extraction, constraints, json, technical-doc]
    content: |
      <|im_start|>system
      你是资深技术文档架构师。只输出JSON，不要输出解释。回复必须以 {{ 开头，以 }} 结尾。
      <|im_end|>
      <|im_start|>user
      请解析以下文档片段，提取5个维度：
      1. chunk_type: [Definition, Table, Example, Constraint, Procedure, Data_List] 选一。
      2. chunk_summary: 50字内概括。
      3. symbol_raw: 字符串数组，提取有逻辑索引意义的标识符（运算符、关键代码）；无则[]。
      4. core_entities: [{{"name": "...", "type": "..."}}]，提取业务/技术含义概念，去噪去重。
      5. operation_constraints: 字符串数组，提取显性或隐性限制。

      待处理片段：
      {content_sample}

      严格按此格式输出：
      {{
          "chunk_type": "...",
          "chunk_summary": "...",
          "symbol_raw": [],
          "core_entities": [],
          "operation_constraints": []
      }}
      <|im_end|>
      <|im_start|>assistant

